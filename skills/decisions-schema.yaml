# ===========================================================================
# assumption-register.yaml — PROJECT LEVEL, persists across features
# ===========================================================================
#
# Every ASSUMED entry lands here. Reviewed at the start of every session and
# every planning cycle. Assumptions have a shelf life; the ones nobody
# revisits are the ones that eventually cost a weekend.
#
# assumptions:
#   - id: ASM-3
#     from: ABS-5
#     feature: shared-standup-notes
#     registered: 2026-07-29
#     assumption: Last-write-wins on concurrent digest entry edits
#     revisit_when: >
#       Any support ticket mentions lost edits, or >5 concurrent editors
#       observed on one digest
#     risk: medium
#     status: open | fired | retired
#     fired_on: null
