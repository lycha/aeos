# decisions.yaml — schema and worked example
#
# Output of the gap-interrogation session. Input to spec writing.
#
# Two sections, resolved in this order:
#   conflict_resolutions — sources disagreed; somebody decided twice
#   decisions            — nobody decided; the gap is now closed or named

# SHARED OUTPUT CONTRACT
# Produced identically by gap-interrogation-solo and gap-interrogation-capture.
# Downstream spec writing does not care which produced it — but provenance is
# recorded, because a simulated session and a real one carry different weight.

meta:
  feature: string
  session: iso8601-date
  mode: solo-simulated | workshop-captured | paired-live
  participants: [string]            # personas for solo-simulated
  artefact_tree:                    # where this file lives
    repo: string
    branch: string
  inventory:                        # references are triples, never bare SHAs
    repo: string
    commit: string
    path: string
  source_artefact: string | null    # workshop-captured only: transcript/notes path
  posture: conservative | decisive  # solo-simulated only
  adversary_rotation: [string]      # paired-live only

# ---------------------------------------------------------------------------
# ROUND 0 — questions
#
# Resolved FIRST. A question is not a product decision; it is an unknown about
# the sources. Answering one usually reclassifies it into a conflict or an
# absence, which must then be resolved in the same session.

question_resolutions:
  - question: Q-1
    outcome: ANSWERED | RECLASSIFIED | ESCALATED | DROPPED

    # ANSWERED — someone knew, or research settled it. This is a fact.
    answer: string
    answered_by: research | human    # research = found in code or sources

    # RECLASSIFIED — it was a conflict or an absence all along.
    # The new item MUST also appear below with its own outcome.
    reclassified_as: conflict | absence
    becomes: CON-12                  # or ABS-24

    # DROPPED — based on a misreading. Reason required; feeds harvest feedback.
    reason: string

    # ESCALATED
    owner: string
    due: iso8601-date

    blocks_released: [ABS-1]         # items this unblocked

# ---------------------------------------------------------------------------
# ROUND 1 — conflicts

conflict_resolutions:
  - conflict: CON-1
    outcome: RESOLVED | RECONCILED | SPLIT | ESCALATED
    resolution: string              # the canonical answer, stated once

    # workshop-captured only. `ambiguous` must be confirmed before recording.
    capture_confidence: explicit | inferred | ambiguous
    evidence: string                # verbatim supporting text from the artefact

    # REQUIRED for RESOLVED and RECONCILED. Decisions are free; the work
    # they create is not. An unowned entry means it silently doesn't happen.
    debt_created:
      - task: string
        owner: string
        due: iso8601-date | null

    affects_downstream: [api-contract, table-names, event-names, ui-copy, tickets]

    # SPLIT only — the two concepts that were wearing one name
    split_into:
      - name: string
        definition: string

    # ESCALATED only
    owner: string
    due: iso8601-date

# ---------------------------------------------------------------------------
# ROUND 2 — absences

decisions:
  - absence: ABS-1
    outcome: DECIDED | DEFERRED | ASSUMED | ESCALATED
    resolution: string

    # workshop-captured only
    capture_confidence: explicit | inferred | ambiguous
    evidence: string                # verbatim supporting text from the artefact

    # DECIDED
    becomes: AC-12                  # the acceptance criterion it produces

    # DEFERRED
    # becomes: NON-GOAL-3

    # ASSUMED — all three fields required
    rationale: string               # why this guess is reasonable
    revisit_when: string            # the observable trigger that invalidates it
    risk: low | medium | high
    decided_by: human | agent       # agent = the humans declined to decide;
                                    # never record such an item as DECIDED

    # ESCALATED
    # question: string
    # owner: string
    # due: iso8601-date
    # blocks: [AC-15]

# ---------------------------------------------------------------------------

summary:
  questions_answered: [Q-1, Q-3]
  questions_reclassified: [Q-2]      # each MUST have a resolved CON/ABS below
  questions_escalated: []
  questions_dropped: [Q-4]
  conflicts_resolved: [CON-9]
  conflicts_escalated: []
  assumptions_registered: [ABS-5]
  escalations_open: [ABS-11]
  debt_created: 2
  stories_ready: [STORY-1, STORY-2]
  stories_blocked: []
  stories_too_big: []               # exceeded timebox twice — split these

  # workshop-captured only — bidirectional reconciliation
  inventory_items_untouched: [ABS-7, ABS-12]   # session never reached these; STILL OPEN
  off_inventory_decisions: [NEW-1]             # decided but never harvested →
                                               # feedback to prototype-harvest
  low_confidence_entries: [ABS-9]              # inferred; worth a second look

