openapi: 3.1.0
info:
  title: Example API
  version: 1.0.0
# One credential model, stated once at the document level.
security:
  - cookieAuth: []
paths:
  /widgets:
    get:
      operationId: listWidgets
      summary: List widgets
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: The widgets
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WidgetList"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      operationId: createWidget
      summary: Create a widget
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WidgetInput"
      responses:
        "201":
          description: The created widget
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Widget"
        "400":
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: session
  schemas:
    Widget:
      type: object
      required: [id, name]
      properties:
        id: { type: string }
        name: { type: string }
    WidgetInput:
      type: object
      required: [name]
      properties:
        name: { type: string }
    WidgetList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Widget"
    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }
