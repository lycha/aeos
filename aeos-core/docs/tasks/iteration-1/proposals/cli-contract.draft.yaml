# DRAFT — FOR HUMAN REVIEW. Not yet the contract.
#
# The API contract of AEOS is its command surface: commands, parameters,
# required resources, output formats and exit codes (decided 10 Nov 2026).
# This file is human-owned. Agents build to it and may not change it; a change
# to it needs its own recorded approval (the contract gate, task I1-M4-004d).
#
# How this draft was made: the `existing` commands, arguments and options were
# read from `aeos <command> --help` on main at 0b01fc8. Everything marked
# `proposed` is new in Iteration 1 and is a proposal for you to accept, change
# or strike. Output shapes are proposals throughout: no command has a JSON
# output today.
#
# When approved: move to aeos-core/cli-contract.yaml and drop ".draft".

contract_version: 0
binary: aeos

# ── Required resources ────────────────────────────────────────────────────
# What must be in place for a command to run. The generated guard checks each
# one before the handler and exits 4 naming the missing resource and the fix.
resources:
  aeos_home:
    description: The AEOS home directory exists (default ~/.aeos, override AEOS_HOME).
    fix: Run `aeos install`.
  project:
    description: An initialised project. `.aeos/project.json` is found from the working directory upward.
    fix: Run `aeos project init` in the project root.
  state_db:
    description: The state database at <aeos_home>/state.db can be opened and migrated.
    fix: Run `aeos install`, or check AEOS_HOME.
  git_repo:
    description: The project root is inside a git work tree.
    fix: Run `git init`, or run the command from the repository.
  executor:
    description: The executor CLI resolved for this run is on PATH.
    fix: Install the executor, or choose another with --executor.
  python:
    description: python3 is on PATH (needed by lint_decisions.py).
    fix: Install Python 3.
    status: proposed            # needed from I1-M3-002a
  gh:
    description: The `gh` command is on PATH and authenticated for this repository.
    fix: Install GitHub CLI and run `gh auth login`.
    status: proposed            # needed from I1-M2-003

# ── Exit codes ────────────────────────────────────────────────────────────
# Today: 0, 1 everywhere, and 130 on interrupt. Failure and escalation both
# exit 1, which contradicts the engine's rule that escalation is not failure.
exit_codes:
  0: { name: success, meaning: The command did what was asked. }
  1: { name: failure, meaning: Something broke — executor crash, validation rejection, unexpected error. }
  2: { name: usage, meaning: Invalid arguments or options. Nothing was attempted. }
  3: { name: needs_human, meaning: The pipeline worked and stopped for a person — escalated, blocked, awaiting approval, a gate, budget exceeded. }
  4: { name: missing_resource, meaning: A required resource is not in place. Nothing was attempted. }
  130: { name: interrupted, meaning: The operator interrupted the run. }

# ── Output formats ────────────────────────────────────────────────────────
output:
  formats: [text, json]
  default: text
  json_flag: --json             # proposed, global, valid on every command
  # With --json, stdout carries exactly one JSON object and nothing else.
  # Progress and diagnostics go to stderr. The terminal interface is disabled.
  envelope:
    ok: boolean                 # true iff exit code is 0
    command: string             # e.g. "ticket move"
    exit: integer               # the exit code, repeated for consumers that lose it
    data: object | null         # the command's declared shape, below
    error:                      # null when ok
      code: string              # stable machine code, e.g. TICKET_NOT_FOUND
      message: string
      resource: string | null   # set when exit is 4

# ── Commands ──────────────────────────────────────────────────────────────
# requires: resources checked before the handler runs.
# exits:    the exit codes this command may return (0, 2 are implied for all).
# data:     the shape of envelope.data on success. Types are TypeScript-like.
commands:
  - name: install
    status: existing
    summary: One-time global setup
    arguments: []
    options: []
    requires: []
    exits: [1]
    data: { aeosHome: string, created: boolean }

  - name: project init
    status: existing
    summary: Initialise a project in the current directory
    arguments: []
    options:
      - { flag: "--name <name>", type: string, required: false, description: "Project name (defaults to directory name)" }
      - { flag: "--key <key>", type: string, required: false, description: "Ticket prefix key (2–4 uppercase letters)" }
    requires: [aeos_home]
    exits: [1, 4]
    data: { name: string, key: string, scaffolded: "string[]" }

  - name: project sync
    status: existing
    summary: Reconcile this project's column specs, agents and rubrics with the current templates
    arguments: []
    options:
      - { flag: "--apply", type: boolean, required: false, description: "Write files that are missing from the project" }
      - { flag: "--force", type: boolean, required: false, description: "Also overwrite drifted files (each backed up to <file>.bak). Implies --apply" }
      - { flag: "--diff", type: boolean, required: false, description: "Show a line diff for each drifted file" }
    requires: [project]
    exits: [1, 4]
    data: { missing: "string[]", drifted: "string[]", written: "string[]" }

  - name: ticket create
    status: existing
    summary: Create a new ticket (an epic by default, or a task with --parent)
    arguments:
      - { name: title, required: true, description: "Ticket title" }
    options:
      - { flag: "--parent <epicId>", type: string, required: false, description: "Create this ticket as a task under the given epic" }
      - { flag: "--key <taskKey>", type: string, required: false, description: "Stable decomposition key (e.g. T-001)" }
      - { flag: "--body <markdown>", type: string, required: false, description: "Markdown description for the ticket" }
      - { flag: "--body-file <path>", type: string, required: false, description: "Read the ticket description from a file" }
      - { flag: "--spec <feature>", type: string, required: false, status: proposed, description: "Back this epic with the spec at .aeos/features/<feature>. Refused unless the decisions lint is clean (I1-M3-002a)" }
      - { flag: "--bug", type: boolean, required: false, status: proposed, description: "Create a standalone bug task that must show a reproducing test red, then green (I1-M4-003)" }
      - { flag: "--implements <ids>", type: "string[]", required: false, status: proposed, description: "Acceptance criteria this task claims, e.g. AC-1,AC-2 (I1-M4-001)" }
    requires: [project, state_db]
    exits: [1, 4]
    data: { ticketId: string, kind: "EPIC | TASK", parentId: "string | null", alreadyExisted: boolean }

  - name: ticket list
    status: existing
    summary: List all tickets in the current project
    arguments: []
    options:
      - { flag: "--column <column>", type: string, required: false, description: "Filter by pipeline column (identifier or label)" }
    requires: [project, state_db]
    exits: [1, 4]
    data: { tickets: "Array<{ id, title, kind, parentId, column, columnLabel, subState }>" }

  - name: ticket show
    status: existing
    summary: Show details of a single ticket
    arguments:
      - { name: id, required: true, description: "Ticket ID (e.g. AEOS-1)" }
    options: []
    requires: [project, state_db]
    exits: [1, 4]
    data: { ticket: "{ id, title, kind, parentId, column, columnLabel, subState, escalation, specPin, pullRequestUrl }", artifacts: "string[]", costUsd: "number | null" }

  - name: ticket run
    status: existing
    summary: Run the full column cycle for a ticket (preflight → executor → checks → review → sign-off)
    arguments:
      - { name: id, required: true, description: "Ticket ID (e.g. AEOS-1)" }
    options:
      - { flag: "--executor <type>", type: "claude-cli | auggie-cli | opencode-cli | ollama-cli", required: false, description: "Override executor type" }
      - { flag: "--model <model>", type: string, required: false, description: "Override model identifier" }
    requires: [project, state_db, executor]
    exits: [1, 3, 4, 130]
    data: { ticketId: string, column: string, subState: string, attempts: integer, artifactPath: "string | null", reviewPath: "string | null", runIds: "string[]", costUsd: "number | null" }

  - name: ticket answer
    status: existing
    summary: Unblock a BLOCKED ticket after answering preflight questions
    arguments:
      - { name: id, required: true, description: "Ticket ID" }
    options: []
    requires: [project, state_db]
    exits: [1, 4]
    data: { ticketId: string, promoted: "string[]", amendedDecisions: "string[]", specPin: "object | null" }

  - name: ticket resolve
    status: existing
    summary: Resume an ESCALATED ticket after writing a decision in its escalation.md
    arguments:
      - { name: id, required: true, description: "Ticket ID" }
    options: []
    requires: [project, state_db]
    exits: [1, 4]
    data: { ticketId: string, subState: string }

  - name: ticket approve
    status: existing
    summary: Advance a SIGNED_OFF ticket to the next pipeline column
    arguments:
      - { name: id, required: true, description: "Ticket ID" }
    options:
      - { flag: "--contract", type: boolean, required: false, status: proposed, description: "Also approve the contract or schema change this ticket carries (I1-M4-004d)" }
    requires: [project, state_db, git_repo]   # plus `gh` when this approval opens a pull request and pullRequests.enabled is true (I1-M2-003)
    exits: [1, 3, 4]
    data: { ticketId: string, fromColumn: string, toColumn: string, pullRequestUrl: "string | null", gateRecordId: string }

  - name: ticket sign-off
    status: existing
    summary: Manually set a ticket sub-state to SIGNED_OFF
    arguments:
      - { name: id, required: true, description: "Ticket ID" }
    options:
      - { flag: "--reason <text>", type: string, required: true, status: proposed, description: "Why the review is being overridden. Recorded as a gate (I1-M3-004)" }
    requires: [project, state_db]
    exits: [1, 4]
    data: { ticketId: string, subState: string, gateRecordId: string }

  - name: ticket move
    status: existing
    summary: Move a ticket to any workflow status
    arguments:
      - { name: id, required: true, description: "Ticket ID" }
      - { name: status, required: true, description: "Target column (identifier or label)" }
    options:
      - { flag: "--reason <text>", type: string, required: true, status: proposed, description: "Why the normal path is being bypassed. Recorded as a gate (I1-M3-004)" }
    requires: [project, state_db]
    exits: [1, 4]
    data: { ticketId: string, fromColumn: string, toColumn: string, gateRecordId: string }

  - name: ticket ready
    status: existing
    summary: Set a ticket sub-state to READY
    arguments:
      - { name: id, required: true, description: "Ticket ID" }
    options: []
    requires: [project, state_db]
    exits: [1, 4]
    data: { ticketId: string, subState: string }

  - name: ticket dod-approve
    status: existing
    summary: Review the conformance report and approve a final-gate ticket as DONE
    arguments:
      - { name: id, required: true, description: "Ticket ID" }
    options:
      - { flag: "--reason <text>", type: string, required: false, status: proposed, description: "Required when any criterion is failed or unverified (I1-M4-002b)" }
      - { flag: "--verified <ids>", type: "string[]", required: false, status: proposed, description: "Criteria a person vouches for, e.g. AC-3,AC-7. Each gains a human instrument citing the gate record (I1-M4-002b)" }
    requires: [project, state_db, git_repo]
    exits: [1, 3, 4]
    data: { ticketId: string, approved: boolean, conformance: "{ pass, fail, unverified, total }", gateRecordId: string }

  - name: ticket repin
    status: proposed            # I1-M3-005
    summary: Move a spec-backed ticket's pin to the current spec after an amendment
    arguments:
      - { name: id, required: true, description: "Ticket ID" }
    options: []
    requires: [project, state_db, python]
    exits: [1, 4]
    data: { ticketId: string, fromCommit: string, toCommit: string, gateRecordId: string }

  - name: orchestrator run
    status: existing
    summary: Run an epic until it completes, needs a human, or hits its budget
    arguments:
      - { name: epicId, required: true, description: "Epic ticket ID" }
    options:
      - { flag: "--budget <usd>", type: number, required: false, description: "USD ceiling for this epic (persisted). Refused on an executor that cannot report cost" }
      - { flag: "--max-steps <n>", type: integer, required: false, description: "Safety bound on scheduled actions" }
    requires: [project, state_db, git_repo, executor]
    exits: [1, 3, 4, 130]
    data: { epicId: string, haltReason: string, message: string, steps: integer, spentUsd: "number | null" }

  - name: orchestrator pause
    status: existing
    summary: Stop scheduling new work for an epic (in-flight runs finish)
    arguments:
      - { name: epicId, required: true, description: "Epic ticket ID" }
    options: []
    requires: [project, state_db]
    exits: [1, 4]
    data: { epicId: string, paused: boolean }

  - name: orchestrator resume
    status: existing
    summary: Allow an epic to be scheduled again
    arguments:
      - { name: epicId, required: true, description: "Epic ticket ID" }
    options: []
    requires: [project, state_db]
    exits: [1, 4]
    data: { epicId: string, paused: boolean }

  - name: orchestrator status
    status: existing
    summary: Show orchestrator state for one epic or all of them
    arguments:
      - { name: epicId, required: false, description: "Epic ticket ID" }
    options: []
    requires: [project, state_db]
    exits: [1, 4]
    data: { epics: "Array<{ epicId, status, haltReason, paused, budgetUsd, spentUsd }>" }

  - name: costs
    status: proposed            # file exists as a stub and is not registered; I1-M1-004
    summary: Report model spend
    arguments: []
    options:
      - { flag: "--project <key>", type: string, required: false, description: "Limit to one project" }
      - { flag: "--epic <id>", type: string, required: false, description: "One epic and its child tasks" }
      - { flag: "--ticket <id>", type: string, required: false, description: "One ticket" }
      - { flag: "--since <date>", type: "YYYY-MM-DD", required: false, description: "Records from this date on" }
    requires: [state_db]
    exits: [1, 4]
    data: { totalUsd: "number | null", unknownRecords: integer, byProject: "Array<{ projectId, totalUsd, byTicket: Array<{ ticketId, totalUsd, byColumn, byRole }> }>" }

  - name: dashboard
    status: proposed            # file exists as a stub and is not registered; the Iteration 1 proving feature
    summary: Cross-project board of tickets by column
    arguments: []
    options: []
    requires: [state_db]
    exits: [1, 4]
    data: { projects: "Array<{ projectId, name, path, columns: Array<{ column, label, tickets }> }>" }

# ── Questions for the reviewer ────────────────────────────────────────────
# 1. Is 3 the right code for "needs a human"? It lets a script loop on 0 and
#    stop cleanly on 3 without treating it as an error.
# 2. Should --reason be required on `ticket move` and `ticket sign-off`
#    (breaking for existing scripts), or optional with a deprecation warning
#    for one release?
# 3. `--json` as a global flag, or `--format json`?
# 4. Should `data` shapes be JSON Schema here rather than TypeScript-like
#    strings? JSON Schema is what the verifier will check against; these
#    strings were chosen to keep the draft readable.
