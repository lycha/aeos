  dashboard:
    operationId: dashboard
    status: proposed            # the file exists as a stub and is not registered
    task: I1-M5-001             # the Iteration 1 proving feature
    summary: Cross-project board of tickets by column
    requires: [state_db]
    parameters: []
    responses:
      "0":
        description: Every project in the state database, with its tickets grouped by column.
        data:
          type: object
          additionalProperties: false
          required: [projects]
          properties:
            projects:
              type: array
              items:
                type: object
                additionalProperties: false
                required: [projectId, name, path, columns]
                properties:
                  projectId: { type: string }
                  name: { type: string }
                  path: { type: string }
                  columns:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      required: [column, label, tickets]
                      properties:
                        column: { $ref: "#/components/schemas/Column" }
                        label: { type: string }
                        tickets: { type: array, items: { $ref: "#/components/schemas/TicketSummary" } }
      "1": { $ref: "#/components/responses/failure" }
      "4": { $ref: "#/components/responses/missingResource" }

# ── Questions for the reviewer ────────────────────────────────────────────
# 1. Is 3 the right code for "needs a human"? It lets a script loop on 0 and
#    stop cleanly on 3 without treating it as an error.
# 2. Should --reason be required on `ticket move` and `ticket sign-off`
#    (breaking for existing scripts), or optional for one release with an
#    entry in envelope.warnings?
# 3. `--json` as a global flag, or `--format json`?
# 4. Output shapes forbid undeclared fields (additionalProperties: false), so
#    adding a field is a contract change that needs your approval. Is that the
#    strictness you want, or should additive fields be free?
# 5. This file is AEOS's own format, shaped after OpenCLI. Should the
#    generator also export a real OpenCLI document (resources and status as
#    x- extensions) for outside tools? Nothing reads one today.
# 6. Prompts. Three commands ask on stdin. This draft lets `ticket answer`
#    and `ticket resolve` skip theirs with --yes, and gives `ticket
#    dod-approve` no --yes at all: without a terminal it exits 3. That keeps
#    an agent from recording a release decision by accident. It is a line for
#    honest callers, not a security boundary. Is it the line you want?
# 7. The envelope gained `warnings` and `contractVersion`. Keep both?
# 8. Error codes (TICKET_NOT_FOUND, NOT_SIGNED_OFF, …) are stable but are not
#    listed here; they live in one enum in code (I1-M4-004c). Should the
#    contract list them too?
