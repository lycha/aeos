    summary: Allow an epic to be scheduled again
    requires: [project, state_db]
    parameters:
      - $ref: "#/components/parameters/epicId"
    responses:
      "0":
        description: The epic can be scheduled.
        data: { $ref: "#/components/schemas/PauseState" }
      "1": { $ref: "#/components/responses/failure" }
      "4": { $ref: "#/components/responses/missingResource" }

  orchestrator status:
    operationId: orchestratorStatus
    summary: Show orchestrator state for one epic or all of them
    requires: [project, state_db]
    parameters:
      - name: epicId
        in: argument
        position: 1
        required: false
        description: Epic ticket ID
        schema: { type: string }
    responses:
      "0":
        description: One entry per epic, possibly none.
        data:
          type: object
          additionalProperties: false
          required: [epics]
          properties:
            epics: { type: array, items: { $ref: "#/components/schemas/EpicState" } }
      "1": { $ref: "#/components/responses/failure" }
      "4": { $ref: "#/components/responses/missingResource" }

  costs:
    operationId: costs
    status: proposed            # the file exists as a stub and is not registered
    task: I1-M1-004
    summary: Report model spend
    requires: [state_db]
    parameters:
      - name: project
        in: option
        valueName: key
        required: false
        description: Limit to one project
        schema: { type: string }
      - name: epic
        in: option
        valueName: id
        required: false
        description: One epic and its child tasks
        schema: { type: string }
      - name: ticket
        in: option
        valueName: id
        required: false
        description: One ticket
        schema: { type: string }
      - name: since
        in: option
        valueName: date
