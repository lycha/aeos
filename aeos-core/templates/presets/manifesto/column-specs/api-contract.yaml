column: API_CONTRACT
label: API contract
role: standard
diffContext: none
phase: PREPARE
# Manifesto stage 7. The API contract (OpenAPI) is human-owned: the worker
# reviews the person's contract against the pinned spec; it never drafts it.
# The human sign-off that follows is the contract gate (see project.json
# `contracts` globs and `ticket approve --contract`).
workerAgentFile: agents/api-contract-agent.yaml
reviewerAgentFile: agents/reviewer-agent.yaml
outputArtifact: api-contract-review.md
minWordCount: 50
requiredSections: []
reviewerRubrics:
  - rubrics/structure/api-contract-structure.md
  - rubrics/drift/intent-drift.md
maxIterations: 3
escalation: escalate_to_human
advanceMode: manual
preflight:
  enabled: true
  questionsArtifact: questions.md
