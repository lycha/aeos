name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The package is in aeos-core/; the schemas it copies are in plugins/.
defaults:
  run:
    working-directory: aeos-core

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: aeos-core/package-lock.json

      # Without these the tests that run lint_decisions.py skip themselves.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install the linter's Python modules
        run: python3 -m pip install PyYAML jsonschema

      - name: Install dependencies
        run: npm ci

      # templates/schemas/ is a generated copy of the plugin's schemas; fail when stale.
      - name: Schemas are current
        run: npm run schemas:check

      # src/cli/generated/ and the command reference are generated from cli-contract.yaml; fail when stale.
      - name: Generated CLI is current
        run: npm run verify:generated

      # cli-contract.yaml is well formed and the CLI matches it.
      - name: CLI matches the contract
        run: npm run verify:contract

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm test
