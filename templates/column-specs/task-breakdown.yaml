column: TASK_BREAKDOWN
# Agentic so the architect can call `aeos ticket create --parent` to decompose
# the epic into child tasks. requiresRepoDiff is false because that work writes
# tickets and a gitignored artifact, not a repo change — the IMPLEMENTATION
# diff guarantee does not apply here.
executorMode: agentic
requiresRepoDiff: false
workerAgentFile: agents/architect-agent.yaml
reviewerAgentFile: agents/reviewer-agent.yaml
outputArtifact: tasks.md
minWordCount: 100
requiredSections: []
reviewerRubrics:
  - rubrics/structure/tech-spec-structure.md
  - rubrics/structure/spec-traceability.md
  - rubrics/drift/intent-drift.md
# The breakdown is reviewed as ONE artifact, not per task. Atomicity, ordering,
# and collective sufficiency are properties of the set — a per-task review
# cannot see them, and would cost N review loops before any code is written.
escalation: escalate_to_human
advanceMode: manual
preflight:
  enabled: false
  questionsArtifact: questions.md
